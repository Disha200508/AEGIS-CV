services:
  # Backend API Service (FastAPI + YOLO + SQLite)
  - type: web
    name: aegis-cv-backend
    env: python
    region: oregon
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt && python backend/seed_demo_data.py"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONPATH
        value: .
